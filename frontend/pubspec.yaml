name: eduverse
description: "EduVerse - AI-Powered Personal Learning Application for Students"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  http: ^1.2.0
  google_generative_ai: ^0.4.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/

